# docker-compose.yml
version: "3.8"
services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq-microservices
    ports:
      - "5672:5672"
      - "15672:15672"   # UI at http://localhost:15672 (guest/guest)
    environment:
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit handshake_timeout 20000"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
